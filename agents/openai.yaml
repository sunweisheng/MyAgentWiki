interface:
  display_name: "MyAgentWiki"
  short_description: "本地 LLM Wiki 工作区与知识维护 Skill"
  default_prompt: "Use $myagentwiki to initialize, ingest, query, lint, and maintain a MyAgentWiki workspace. If the user-named directory already contains a top-level raw directory, treat that top-level raw directory as the only default source and do not proactively merge in Clippings, other top-level directories, or loose files unless the user explicitly asks to combine sources. When the user already specified a raw directory, restrict pre-init and pre-ingest file checks to that raw directory instead of inspecting parent folders, sibling folders, or the whole repository unless the user explicitly asks for broader discovery. When the user has not specified a raw directory yet, do not probe nearby workspaces, sibling folders, or parent folders to guess one; continue only from the user-named directory or the current workspace configuration, and state any restructuring assumption explicitly."

policy:
  allow_implicit_invocation: true
