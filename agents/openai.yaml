interface:
  display_name: "MyAgentWiki"
  short_description: "本地 LLM Wiki 工作区与知识维护 Skill"
  default_prompt: "Use $myagentwiki to initialize, ingest, query, lint, and maintain a MyAgentWiki workspace. When the user already specified a raw directory, restrict pre-init and pre-ingest file checks to that raw directory instead of inspecting parent folders, sibling folders, or the whole repository unless the user explicitly asks for broader discovery."

policy:
  allow_implicit_invocation: true
