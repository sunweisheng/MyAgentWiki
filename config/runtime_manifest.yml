runtime:
  python:
    required: true
    version: ">=3.12"
  git:
    required: true
    check:
      command: ["git", "--version"]

python_packages:
  required:
    - "markitdown"
    - "mammoth"
    - "lxml"
    - "pandas"
    - "python-pptx"
    - "xlrd"
    - "pdfminer-six"
    - "pdfplumber"
    - "olefile"
    - "python-docx"
    - "openpyxl"
    - "pypdf"
    - "pillow"
    - "openai"
    - "json-repair"
    - "jsonschema"
  optional:
    ocr: []
    office: []
    pdf: []

system_tools:
  optional:
    tesseract:
      supported_platforms: ["windows", "macos", "linux"]
      purpose: "Optional OCR enhancement for image-heavy sources."
      check:
        command: ["tesseract", "--version"]
      fallback: "Use LLM-assisted image understanding when unavailable."
